<!DOCTYPE html>

<html>
<head>
  <title>Areej's Projects</title>

  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: #f8f1f7;
      color: #4d4652;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 70px 25px;
    }

    .hero {
      background: #eee4f4;
      padding: 55px 30px;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(100, 80, 110, 0.08);
    }

    .symbol {
      font-size: 28px;
      color: #a88bbd;
      letter-spacing: 10px;
    }

    h1 {
      font-size: 48px;
      margin: 15px 0 10px;
      color: #665274;
      font-weight: 600;
    }

    .intro {
      font-size: 18px;
      color: #776d7d;
    }

    .section {
      background: #fffaf7;
      margin-top: 25px;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 6px 20px rgba(100, 80, 110, 0.06);
    }

    h2 {
      color: #765f83;
      font-size: 24px;
      margin-top: 0;
    }

    .symbols {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .project {
      background: #f3e8ef;
      padding: 22px;
      border-radius: 20px;
      margin-top: 15px;
    }

    .project h3 {
      margin: 5px 0 8px;
      color: #6c5878;
      font-size: 21px;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 25px;
      background: #c8afd5;
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      background: #aa8bbd;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #938999;
    }

    @media (max-width: 600px) {
      .container {
        padding: 35px 15px;
      }

      h1 {
        font-size: 36px;
      }

      .hero {
        padding: 40px 20px;
      }
    }
  </style>

</head>
