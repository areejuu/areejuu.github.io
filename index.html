<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Projects ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6efe7;
      color: #514b48;
      font-family: "Trebuchet MS", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* tiny background dots */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image: radial-gradient(#cdbdb0 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .page {
      width: min(900px, 92%);
      margin: auto;
      padding: 55px 0 45px;
      position: relative;
    }

    /* floating decorations */
    .sticker {
      position: absolute;
      font-size: 24px;
      opacity: 0.75;
    }

    .sticker.one {
      top: 45px;
      left: 2%;
      transform: rotate(-15deg);
    }

    .sticker.two {
      top: 95px;
      right: 3%;
      transform: rotate(12deg);
    }

    .sticker.three {
      top: 390px;
      left: -5px;
      transform: rotate(10deg);
    }

    .sticker.four {
      top: 650px;
      right: 5px;
      transform: rotate(-12deg);
    }

    /* heading */
    .intro {
      text-align: center;
      margin-bottom: 45px;
    }

    .tiny {
      color: #a18d82;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
